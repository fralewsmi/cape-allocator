service: cape-allocator-api

frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  stage: ${opt:stage, env:SERVERLESS_STAGE, "dev"}
  region: ${opt:region, env:AWS_REGION, "ap-southeast-2"}
  environment:
    FRED_API_KEY: ${env:FRED_API_KEY}
    CORS_ORIGINS: ${env:CORS_ORIGINS, "*"}
    CAPE_CACHE_DIR: /tmp/cape_allocator
    CAPE_CACHE_TTL_HOURS: 24

functions:
  api:
    handler: api.main.handler
    events:
      - http:
          path: /
          method: ANY
          cors: true
      - http:
          path: /{proxy+}
          method: ANY
          cors: true

plugins:
  - serverless-python-requirements

package:
  patterns:
    - "!./**"
    - "api/**"
    - "src/**"
    - "pyproject.toml"
    - "requirements.txt"

custom:
  pythonRequirements:
    dockerizePip: true
